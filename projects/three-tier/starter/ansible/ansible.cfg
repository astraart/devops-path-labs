[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
# Машины стенда пересоздаются при каждом terraform apply, и ключи хоста меняются.
# Только для учебного стенда: на настоящих серверах проверку ключей не отключают.
host_key_checking = False

[ssh_connection]
pipelining = True
